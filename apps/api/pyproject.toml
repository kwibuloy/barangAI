[project]
name = "barangai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<2.1", "alembic", "argon2-cffi", "python-multipart", "Pillow", "httpx", "google-auth[requests]==2.58.0"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "ruff"]
ai = ["onnxruntime", "numpy", "opencv-python-headless"]
# The parked PostgreSQL route (deploy/). The local SQLite install needs no driver.
postgres = ["psycopg2-binary"]

[tool.setuptools.packages.find]
include = ["barangai*"]
