name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Without the AI extra: the API must start without it. The postgres extra lets its URL tests run.
      - run: pip install -c deploy/constraints-render.txt -e "./apps/api[dev,postgres]"
      # Fails on a known vulnerability in a pinned version. --no-deps because the files already pin everything.
      - run: pipx run pip-audit --disable-pip --no-deps -r deploy/constraints-render.txt
      - run: pipx run pip-audit --disable-pip --no-deps -r deploy/requirements-render-vision.txt
      - run: ruff check apps/api
      - run: pytest apps/api/tests -q -p no:cacheprovider

  # With the AI extra, so the face and plate blur tests run instead of skipping, and one whole journey in a real browser
  # with blur on: register, report, staff to Resolved, points, reward, deletion, server stopped.
  journey:
    runs-on: ubuntu-latest
    env:
      CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -c deploy/constraints-render.txt -c deploy/requirements-render-vision.txt -e "./apps/api[dev,ai]"
      # A missing library would skip the blur tests silently, so this fails first.
      - run: python -c "import cv2, numpy, onnxruntime"
      - run: pytest apps/api/tests -q -p no:cacheprovider -rs
      - run: npm ci
        working-directory: apps/web
      - run: node scripts/journey.mjs
        working-directory: apps/web
        env:
          PYTHON: python

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # What ships to phones and browsers; dev tools such as vitest and puppeteer-core are reviewed separately.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prettier --check src tests
      - run: npm test
      - run: npm run build
